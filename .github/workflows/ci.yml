name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Privacy scan
        run: python scripts/check_privacy.py
      - name: Unit tests
        run: pytest -q

